<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điểm danh buổi học - Student Module</title>
  <link rel="stylesheet" href="/shared/css/variables.css">
  <link rel="stylesheet" href="/shared/css/base.css">
  <link rel="stylesheet" href="/shared/css/components.css">
  <link rel="stylesheet" href="/shared/css/layout.css">
</head>
<body>
  <div id="app">
    <div id="sidebar"></div>
    <div class="main-content">
      <div id="header"></div>
      <div class="content">
        <nav class="breadcrumb">
          <a href="/">Tổng quan</a> / <span>Học viên</span> / <span>Điểm danh buổi học</span>
        </nav>

        <div class="card">
          <div class="card-header" style="flex-wrap: wrap; gap: var(--space-md);">
            <div>
              <h1 class="heading-1">Sổ Điểm Danh Buổi Học</h1>
              <p class="text-secondary text-sm">Theo dõi chuyên cần và ghi nhận điểm danh theo từng buổi học của lớp</p>
            </div>
            <div style="display: flex; gap: var(--space-sm); align-items: center; flex-wrap: wrap;">
              <select class="form-select" style="width: 240px;" id="classFilter" onchange="loadAttendance()">
                <option value="">Tất cả lớp học</option>
              </select>
              <input type="date" class="form-input" style="width: 160px;" id="dateFilter" onchange="loadAttendance()">
              <button class="btn btn-primary" id="btnCreateAttendance" style="display: none;" onclick="openCreateModal()">
                + Điểm danh mới
              </button>
            </div>
          </div>
          <div class="card-body">
            <div class="table-container">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Lớp học</th>
                    <th>Mã HV</th>
                    <th>Học viên</th>
                    <th>Ngày học</th>
                    <th>Trạng thái điểm danh</th>
                    <th>Ghi chú giáo viên</th>
                    <th id="actionColHeader">Thao tác</th>
                  </tr>
                </thead>
                <tbody id="attendance-tbody">
                  <tr>
                    <td colspan="7" style="text-align: center; color: var(--color-text-secondary);">
                      Đang tải dữ liệu điểm danh...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Ghi Nhận / Chỉnh Sửa Điểm Danh -->
  <div class="modal-overlay" id="attendanceModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="heading-3" id="attModalTitle">Điểm Danh Buổi Học</h3>
        <button class="modal-close" type="button" onclick="closeModal()">&times;</button>
      </div>
      <form id="attendanceForm">
        <input type="hidden" id="editingAttendanceId">
        <div class="modal-body">
          <div class="form-group">
            <label class="label" for="attClassId">Lớp học <span class="required">*</span></label>
            <select id="attClassId" class="form-select" required onchange="loadClassStudentsForModal()"></select>
          </div>
          <div class="form-group">
            <label class="label" for="attStudentId">Học viên <span class="required">*</span></label>
            <select id="attStudentId" class="form-select" required>
              <option value="">-- Chọn học viên --</option>
            </select>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md);">
            <div class="form-group">
              <label class="label" for="attDate">Ngày học <span class="required">*</span></label>
              <input type="date" id="attDate" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="label" for="attStatus">Trạng thái <span class="required">*</span></label>
              <select id="attStatus" class="form-select" required>
                <option value="PRESENT">Có mặt (PRESENT)</option>
                <option value="LATE">Đi muộn (LATE)</option>
                <option value="ABSENT">Vắng mặt (ABSENT)</option>
                <option value="EXCUSED">Có phép (EXCUSED)</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="label" for="attNotes">Ghi chú</label>
            <textarea id="attNotes" class="form-textarea" rows="2" placeholder="Nhận xét buổi học hoặc lý do..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Đóng</button>
          <button type="submit" class="btn btn-primary" id="btnSubmitAttendance">Lưu điểm danh</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/shared/js/auth.js"></script>
  <script src="/shared/js/api.js"></script>
  <script src="/shared/js/layout.js"></script>
  <script>
    let currentUser = null;
    let currentRole = '';
    let canEditAttendance = false;
    let classList = [];
    let classMap = {};
    let attendanceRows = [];

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getAttendanceBadge(st) {
      if (st === 'PRESENT') return '<span class="badge badge-success">Có mặt (PRESENT)</span>';
      if (st === 'LATE') return '<span class="badge badge-warning">Đi muộn (LATE)</span>';
      if (st === 'ABSENT') return '<span class="badge badge-danger">Vắng mặt (ABSENT)</span>';
      if (st === 'EXCUSED') return '<span class="badge badge-info">Có phép (EXCUSED)</span>';
      return `<span class="badge badge-info">${escapeHtml(st)}</span>`;
    }

    async function initPage() {
      requireAuth();
      currentUser = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
      currentRole = String(currentUser?.role || '').toUpperCase();
      canEditAttendance = ['ADMIN', 'STAFF', 'TEACHER'].includes(currentRole);

      if (canEditAttendance) {
        document.getElementById('btnCreateAttendance').style.display = 'inline-flex';
      } else {
        document.getElementById('actionColHeader').style.display = 'none';
      }

      await loadClasses();
      await loadAttendance();
    }

    async function loadClasses() {
      const filterEl = document.getElementById('classFilter');
      const modalClassEl = document.getElementById('attClassId');
      try {
        const res = await apiGet('/api/admission/classes');
        let classes = (res && Array.isArray(res.data)) ? res.data : [];

        // Neu la TEACHER thi chi loc cac lop giao vien phu trach
        if (currentRole === 'TEACHER' && currentUser?.id) {
          const uid = parseInt(currentUser.id, 10);
          classes = classes.filter(c => parseInt(c.teacher_id, 10) === uid);
        }

        classList = classes;
        classMap = {};
        classes.forEach(c => { classMap[c.id] = `${c.code} - ${c.name}`; });

        filterEl.innerHTML = '<option value="">Tất cả lớp học</option>' +
          classes.map(c => `<option value="${c.id}">${escapeHtml(c.code)} - ${escapeHtml(c.name)}</option>`).join('');

        modalClassEl.innerHTML = classes.length > 0
          ? classes.map(c => `<option value="${c.id}">${escapeHtml(c.code)} - ${escapeHtml(c.name)}</option>`).join('')
          : '<option value="1">Lớp #1</option>';
      } catch (err) {
        filterEl.innerHTML = '<option value="">Tất cả lớp học</option><option value="1">Lớp #1</option>';
        modalClassEl.innerHTML = '<option value="1">Lớp #1</option>';
      }
    }

    async function loadAttendance() {
      const tbody = document.getElementById('attendance-tbody');
      const colSpan = canEditAttendance ? 7 : 6;
      const classId = document.getElementById('classFilter').value;
      const sessionDate = document.getElementById('dateFilter').value;

      const params = new URLSearchParams();
      if (classId) params.set('class_id', classId);
      if (sessionDate) params.set('session_date', sessionDate);

      try {
        const qs = params.toString();
        const res = await apiGet(`/api/student/attendance${qs ? '?' + qs : ''}`);
        const rows = (res && res.data) ? res.data : [];
        attendanceRows = rows;

        if (rows.length === 0) {
          tbody.innerHTML = `<tr><td colspan="${colSpan}" style="text-align: center; color: var(--color-text-secondary);">Chưa có dữ liệu điểm danh phù hợp.</td></tr>`;
          return;
        }

        tbody.innerHTML = rows.map(a => `
          <tr>
            <td>${escapeHtml(classMap[a.class_id] || ('Lớp #' + a.class_id))}</td>
            <td>${escapeHtml(a.student_code || ('#' + a.student_id))}</td>
            <td><strong>${escapeHtml(a.student_name || ('Học viên #' + a.student_id))}</strong></td>
            <td>${escapeHtml(formatDate(a.session_date))}</td>
            <td>${getAttendanceBadge(a.status)}</td>
            <td>${escapeHtml(a.notes || '-')}</td>
            ${canEditAttendance ? `<td><button class="btn btn-secondary btn-sm" onclick="openEditModal(${a.id})">Sửa</button></td>` : ''}
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `
          <tr><td colspan="${colSpan}" style="text-align: center; color: var(--color-danger);">
            ${escapeHtml(err.message || 'Không thể tải dữ liệu điểm danh.')}
          </td></tr>
        `;
      }
    }

    async function loadClassStudentsForModal(preselectStudentId = null) {
      const classId = document.getElementById('attClassId').value;
      const selectEl = document.getElementById('attStudentId');
      selectEl.innerHTML = '<option value="">Đang tải học viên...</option>';

      let members = [];
      if (classId) {
        try {
          const res = await apiGet(`/api/student/classes/${classId}/members`);
          if (res && Array.isArray(res.data)) {
            members = res.data.filter(m => m.student_id != null);
          }
        } catch (err) {
          // Fallback cho ADMIN/STAFF neu admission internal enrollments chua kha dung
        }
      }

      if (members.length === 0 && (currentRole === 'ADMIN' || currentRole === 'STAFF')) {
        try {
          const stuRes = await apiGet('/api/student/students');
          if (stuRes && Array.isArray(stuRes.data)) {
            members = stuRes.data.map(s => ({
              student_id: s.id,
              student_code: s.student_code,
              full_name: s.full_name
            }));
          }
        } catch (err) {}
      }

      if (members.length === 0) {
        selectEl.innerHTML = '<option value="">Không có học viên nào trong lớp này</option>';
        return;
      }

      selectEl.innerHTML = '<option value="">-- Chọn học viên --</option>' +
        members.map(m => `<option value="${m.student_id}">${escapeHtml(m.student_code || '#' + m.student_id)} - ${escapeHtml(m.full_name)}</option>`).join('');

      if (preselectStudentId) {
        selectEl.value = String(preselectStudentId);
      }
    }

    async function openCreateModal() {
      document.getElementById('attendanceForm').reset();
      document.getElementById('editingAttendanceId').value = '';
      document.getElementById('attModalTitle').textContent = 'Điểm Danh Buổi Học Mới';
      document.getElementById('attClassId').disabled = false;
      document.getElementById('attStudentId').disabled = false;

      const selectedClass = document.getElementById('classFilter').value;
      if (selectedClass) {
        document.getElementById('attClassId').value = selectedClass;
      }
      document.getElementById('attDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('attendanceModal').classList.add('active');
      await loadClassStudentsForModal();
    }

    async function openEditModal(attId) {
      const row = attendanceRows.find(item => item.id === attId);
      if (!row) return;

      document.getElementById('editingAttendanceId').value = String(row.id);
      document.getElementById('attModalTitle').textContent = `Cập Nhật Điểm Danh #${row.id}`;
      document.getElementById('attClassId').value = String(row.class_id);
      document.getElementById('attClassId').disabled = true;
      document.getElementById('attDate').value = row.session_date;
      document.getElementById('attStatus').value = row.status;
      document.getElementById('attNotes').value = row.notes || '';

      const studentSelect = document.getElementById('attStudentId');
      studentSelect.innerHTML = `<option value="${row.student_id}">${escapeHtml(row.student_code || '#' + row.student_id)} - ${escapeHtml(row.student_name || '')}</option>`;
      studentSelect.value = String(row.student_id);
      studentSelect.disabled = true;

      document.getElementById('attendanceModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('attendanceModal').classList.remove('active');
    }

    document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const editingId = document.getElementById('editingAttendanceId').value;
      const submitBtn = document.getElementById('btnSubmitAttendance');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Đang lưu...';

      try {
        if (editingId) {
          const payload = {
            session_date: document.getElementById('attDate').value,
            status: document.getElementById('attStatus').value,
            notes: document.getElementById('attNotes').value.trim() || null
          };
          await apiPut(`/api/student/attendance/${editingId}`, payload);
          showToast('success', 'Đã cập nhật bản ghi điểm danh!');
        } else {
          const payload = {
            class_id: parseInt(document.getElementById('attClassId').value, 10),
            student_id: parseInt(document.getElementById('attStudentId').value, 10),
            session_date: document.getElementById('attDate').value,
            status: document.getElementById('attStatus').value,
            notes: document.getElementById('attNotes').value.trim() || null
          };
          await apiPost('/api/student/attendance', payload);
          showToast('success', 'Ghi nhận điểm danh thành công!');
        }
        closeModal();
        loadAttendance();
      } catch (err) {
        // api.js da hien thi toast loi
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Lưu điểm danh';
      }
    });

    initPage();
  </script>
</body>
</html>
