server.port=${PORT_ADMISSION:8081}

# Database Connection
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:english_center}?currentSchema=admission
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres_secret_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=admission

# API Naming Strategy (SNAKE_CASE as specified in docs/MASTER_DB_AND_API_RULES.md)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=false

# JWT Secret & Expiration
jwt.secret=${JWT_SECRET:super_secret_jwt_key_english_center_2026_change_in_production}
jwt.access-token-expiration-seconds=${JWT_ACCESS_EXPIRATION:900}
jwt.refresh-token-expiration-days=${JWT_REFRESH_EXPIRATION:7}

# Internal Inter-service Secrets & URLs
internal.secret-key=${INTERNAL_SECRET_KEY:english_center_internal_secret_2026}
services.student.url=${STUDENT_SERVICE_URL:http://student-service:8082}
services.finance.url=${FINANCE_SERVICE_URL:http://finance-service:8084}

# SMTP Admission: bật bằng biến môi trường, không ghi body/token vào log.
admission.mail.enabled=${ADMISSION_MAIL_ENABLED:false}
admission.mail.from=${SMTP_FROM:no-reply@example.invalid}
admission.mail.account-url=${ADMISSION_ACCOUNT_URL:http://localhost:8080/admission/account.html}
spring.mail.host=${SMTP_HOST:127.0.0.1}
spring.mail.port=${SMTP_PORT:2525}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false

# Chỉ bật sau khi kiểm chứng endpoint Student; không mặc định cho phép replay timeout.
admission.student-sync.enabled=${ADMISSION_STUDENT_SYNC_ENABLED:false}
admission.student-sync.idempotency-verified=${ADMISSION_STUDENT_SYNC_IDEMPOTENCY_VERIFIED:false}
