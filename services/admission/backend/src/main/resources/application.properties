server.port=${PORT_ADMISSION:8081}

# Database Connection
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:english_center}?currentSchema=admission
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres_secret_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=admission

# API Naming Strategy (SNAKE_CASE as specified in docs/api-conventions.md)
spring.jackson.property-naming-strategy=SNAKE_CASE

# JWT Secret
jwt.secret=${JWT_SECRET:super_secret_jwt_key_english_center_2026_change_in_production}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
