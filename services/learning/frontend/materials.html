<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Học liệu Số - Trung tâm Anh ngữ</title>
    <link rel="stylesheet" href="/shared/css/variables.css">
    <link rel="stylesheet" href="/shared/css/base.css">
    <link rel="stylesheet" href="/shared/css/components.css">
    <link rel="stylesheet" href="/shared/css/layout.css">
</head>
<body>
    <div id="app">
        <div id="sidebar"></div>
        <div class="main-content">
        <div id="header"></div>
        <div class="content">
            <nav class="breadcrumb">
            <a href="/">Trang chủ</a> / <span>Đào tạo & Học tập</span> / <span>Kho học liệu số</span>
            </nav>

            <div class="card">
            <div class="card-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                <div>
                <h1 class="heading-1">Kho Học liệu Số theo Lớp</h1>
                <p class="text-sm" style="color: var(--color-text-secondary);">
                    
                </p>
                </div>
                <div style="display:flex; gap:8px;">
                <a href="/learning/grades.html" class="btn btn-secondary">Sổ điểm</a>
                <a href="/learning/reports.html" class="btn btn-secondary">Báo cáo Pass/Fail</a>
                <button class="btn btn-primary" onclick="openMaterialModal()">+ Đăng tải học liệu</button>
                </div>
            </div>

            <div class="card-body">
                <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom: var(--space-md);">
                <div class="form-group" style="min-width: 150px;">
                    <label class="label" for="filterClassId">Mã Lớp</label>
                    <input type="number" id="filterClassId" class="form-input" value="1" min="1">
                </div>
                <div class="form-group" style="min-width: 180px;">
                    <label class="label" for="filterType">Loại học liệu</label>
                    <select id="filterType" class="form-select">
                    <option value="">Tất cả loại</option>
                    <option value="DOCUMENT">DOCUMENT (Tài liệu)</option>
                    <option value="SLIDE">SLIDE (Slide bài giảng)</option>
                    <option value="VIDEO">VIDEO (Video)</option>
                    <option value="EXERCISE">EXERCISE (Bài tập)</option>
                    </select>
                </div>
                <div class="form-group" style="flex:1; min-width: 220px;">
                    <label class="label" for="filterSearch">Tìm kiếm tiêu đề</label>
                    <input type="text" id="filterSearch" class="form-input" placeholder="Nhập từ khóa tiêu đề...">
                </div>
                <div class="form-group" style="display:flex; align-items:flex-end;">
                    <button class="btn btn-secondary" onclick="loadMaterials(1)">Lọc dữ liệu</button>
                </div>
                </div>

                <div style="overflow-x:auto;">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Lớp</th>
                        <th>Tiêu đề & Mô tả</th>
                        <th>Phân loại</th>
                        <th>File / Đường dẫn</th>
                        <th>Dung lượng</th>
                        <th>Cập nhật</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody id="materialsTableBody">
                    <tr>
                        <td colspan="8" style="text-align:center;">Đang tải dữ liệu...</td>
                    </tr>
                    </tbody>
                </table>
                </div>

                <div id="materialsPagination" style="display:flex; justify-content:space-between; align-items:center; margin-top: var(--space-md);"></div>
            </div>
            </div>
        </div>
        </div>
    </div>

    <!-- Modal Đăng tải học liệu -->
    <div class="modal-overlay" id="materialModal" style="display:none;">
        <div class="modal">
        <div class="modal-header">
            <h3 class="heading-3">Đăng tải Học liệu Mới</h3>
            <button class="modal-close" onclick="closeMaterialModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
            <label class="label" for="matClassId">ID Lớp học <span class="required">*</span></label>
            <input type="number" id="matClassId" class="form-input" value="1" min="1" required>
            </div>
            <div class="form-group">
            <label class="label" for="matTitle">Tiêu đề học liệu <span class="required">*</span></label>
            <input type="text" id="matTitle" class="form-input" placeholder="VD: IELTS Reading Unit 1" required>
            </div>
            <div class="form-group">
            <label class="label" for="matType">Phân loại <span class="required">*</span></label>
            <select id="matType" class="form-select">
                <option value="DOCUMENT">DOCUMENT</option>
                <option value="SLIDE">SLIDE</option>
                <option value="VIDEO">VIDEO</option>
                <option value="EXERCISE">EXERCISE</option>
            </select>
            </div>
            <div class="form-group">
            <label class="label" for="matFileUrl">Đường dẫn File <span class="required">*</span></label>
            <input type="text" id="matFileUrl" class="form-input" placeholder="https://cdn.englishcenter.edu.vn/materials/unit1.pdf" required>
            </div>
            <div class="form-group">
            <label class="label" for="matFilename">Tên file gốc </label>
            <input type="text" id="matFilename" class="form-input" placeholder="unit1_reading.pdf">
            </div>
            <div class="form-group">
            <label class="label" for="matFileSize">Dung lượng </label>
            <input type="number" id="matFileSize" class="form-input" min="0" placeholder="1048576">
            </div>
            <div class="form-group">
            <label class="label" for="matDesc">Mô tả hướng dẫn</label>
            <textarea id="matDesc" class="form-input" rows="3" placeholder="Đọc trước tài liệu trước khi đến lớp..."></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeMaterialModal()">Hủy</button>
            <button class="btn btn-primary" onclick="submitCreateMaterial()">Lưu học liệu</button>
        </div>
        </div>
    </div>

    <script src="/shared/js/auth.js"></script>
    <script src="/shared/js/api.js"></script>
    <script src="/shared/js/layout.js"></script>
    <script src="/learning/js/materials.js"></script>
</body>
</html>
