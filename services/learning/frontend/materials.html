<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học liệu - Trung tâm Anh ngữ</title>
    <link rel="stylesheet" href="/shared/css/variables.css">
    <link rel="stylesheet" href="/shared/css/base.css">
    <link rel="stylesheet" href="/shared/css/components.css">
    <link rel="stylesheet" href="/shared/css/layout.css">
</head>
<body>
    <div id="app">
        <div id="sidebar"></div>
        <div class="main-content">
        <div id="header"></div>
        <div class="content">
            <nav class="breadcrumb">
            <a href="/">Trang chủ</a> / <span>Học liệu</span>
            </nav>

            <div class="card">
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                <h1 class="heading-1">Quản lý Học liệu</h1>
                <!-- Nút này sẽ được JS ẩn/hiện theo role -->
                <button class="btn btn-primary" id="btnAddMaterial" style="display: none;">+ Thêm học liệu</button>
            </div>
            <div class="card-body">
                <table class="data-table">
                <thead>
                    <tr>
                    <th>ID</th>
                    <th>Tên tài liệu</th>
                    <th>Mô tả</th>
                    <th>Loại</th>
                    <th>Ngày tải lên</th>
                    <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="materialTableBody">
                    <!-- Data rendered here -->
                </tbody>
                </table>
            </div>
            </div>

        </div>
        </div>
    </div>

    <!-- Modal Thêm Học Liệu -->
    <div class="modal-overlay" id="modalAddMaterial" style="display: none;">
        <div class="modal">
        <div class="modal-header">
            <h3 class="heading-3">Thêm học liệu mới</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="formAddMaterial">
            <div class="form-group">
                <label class="label">Lớp học (Class ID) <span class="required">*</span></label>
                <input type="number" class="form-input" id="matClassId" required>
            </div>
            <div class="form-group">
                <label class="label">Tên tài liệu <span class="required">*</span></label>
                <input type="text" class="form-input" id="matTitle" required>
            </div>
            <div class="form-group">
                <label class="label">Mô tả</label>
                <input type="text" class="form-input" id="matDesc">
            </div>
            <div class="form-group">
                <label class="label">Loại học liệu</label>
                <select class="form-select" id="matType">
                <option value="DOCUMENT">Tài liệu (Document)</option>
                <option value="SLIDE">Slide bài giảng</option>
                <option value="VIDEO">Video</option>
                <option value="EXERCISE">Bài tập</option>
                </select>
            </div>
            <div class="form-group">
                <label class="label">Đường dẫn File/URL</label>
                <input type="url" class="form-input" id="matUrl">
            </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">Hủy</button>
            <button class="btn btn-primary" onclick="submitMaterial()">Lưu</button>
        </div>
        </div>
    </div>

    <script src="/shared/js/auth.js"></script>
    <script src="/shared/js/api.js"></script>
    <script src="/shared/js/layout.js"></script>
    <script src="/learning/js/materials.js"></script>
</body>
</html>
