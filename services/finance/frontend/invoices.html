<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hóa đơn & Thu phí - Finance Module</title>
  <link rel="stylesheet" href="/shared/css/variables.css">
  <link rel="stylesheet" href="/shared/css/base.css">
  <link rel="stylesheet" href="/shared/css/components.css">
  <link rel="stylesheet" href="/shared/css/layout.css">
</head>
<body>
  <div id="app">
    <div id="sidebar"></div>
    <div class="main-content">
      <div id="header"></div>
      <div class="content">
        <nav class="breadcrumb">
          <a href="/">Tổng quan</a> / <span>Tài chính</span> / <span>Hóa đơn & Thu phí</span>
        </nav>

        <div class="card">
          <div class="card-header">
            <div>
              <h1 class="heading-1">Quản Lý Hóa Đơn & Thu Học Phí</h1>
              <p class="text-secondary text-sm">Theo dõi hóa đơn học phí, trạng thái đóng tiền và thanh toán</p>
            </div>
            <button class="btn btn-primary" onclick="openCreateModal()">
              + Tạo hóa đơn mới
            </button>
          </div>
          <div class="card-body">
            <div class="table-container">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Mã hóa đơn</th>
                    <th>Mã học viên</th>
                    <th>Số tiền học phí</th>
                    <th>Hạn nộp</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                  </tr>
                </thead>
                <tbody id="invoices-tbody">
                  <tr>
                    <td colspan="6" style="text-align: center; color: var(--color-text-secondary);">
                      Đang tải danh sách hóa đơn...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Tạo hóa đơn -->
  <div class="modal-overlay" id="invoiceModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="heading-3">Lập Hóa Đơn Mới</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="invoiceForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="label" for="invCode">Mã hóa đơn <span class="required">*</span></label>
            <input type="text" id="invCode" class="form-input" placeholder="INV-2026-004" required>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md);">
            <div class="form-group">
              <label class="label" for="studentId">ID Học viên <span class="required">*</span></label>
              <input type="number" id="studentId" class="form-input" value="1" required>
            </div>
            <div class="form-group">
              <label class="label" for="dueDate">Hạn thanh toán</label>
              <input type="date" id="dueDate" class="form-input">
            </div>
          </div>
          <div class="form-group">
            <label class="label" for="amount">Số tiền (VND) <span class="required">*</span></label>
            <input type="number" id="amount" class="form-input" placeholder="6500000" step="50000" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Đóng</button>
          <button type="submit" class="btn btn-primary">Lập hóa đơn</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/shared/js/auth.js"></script>
  <script src="/shared/js/api.js"></script>
  <script src="/shared/js/layout.js"></script>
  <script>
    async function loadInvoices() {
      const tbody = document.getElementById('invoices-tbody');
      try {
        const res = await apiGet('/api/finance/invoices');
        const list = (res && res.data) ? res.data : [];

        if (list.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align: center;">Chưa có hóa đơn nào.</td></tr>`;
          return;
        }

        tbody.innerHTML = list.map(inv => `
          <tr>
            <td><code>${inv.invoice_code}</code></td>
            <td>Học viên #${inv.student_id}</td>
            <td><strong style="color: var(--color-primary);">${formatCurrency(inv.amount)}</strong></td>
            <td>${formatDate(inv.due_date)}</td>
            <td>
              <span class="badge ${inv.status === 'PAID' ? 'badge-success' : 'badge-danger'}">
                ${inv.status === 'PAID' ? 'Đã nộp đủ' : 'Chưa đóng'}
              </span>
            </td>
            <td>
              ${inv.status === 'UNPAID' ? `
                <button class="btn btn-primary btn-sm" onclick="payInvoice(${inv.id}, ${inv.amount})">
                  Thu tiền 💰
                </button>
              ` : `
                <span class="text-xs text-secondary">Đã đối soát</span>
              `}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `
          <tr><td colspan="6" style="text-align: center; color: var(--color-danger);">
            Không thể tải dữ liệu từ API Finance (:8084). Vui lòng kiểm tra container.
          </td></tr>
        `;
      }
    }

    function openCreateModal() {
      document.getElementById('invoiceForm').reset();
      document.getElementById('invCode').value = 'INV-' + Math.floor(1000 + Math.random() * 9000);
      document.getElementById('invoiceModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('invoiceModal').classList.remove('active');
    }

    document.getElementById('invoiceForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        invoice_code: document.getElementById('invCode').value.trim(),
        student_id: parseInt(document.getElementById('studentId').value, 10),
        amount: parseFloat(document.getElementById('amount').value),
        due_date: document.getElementById('dueDate').value || null
      };

      try {
        await apiPost('/api/finance/invoices', payload);
        showToast('success', 'Đã lập hóa đơn mới!');
        closeModal();
        loadInvoices();
      } catch (e) {}
    });

    async function payInvoice(id, amount) {
      if (!confirm(`Xác nhận ghi nhận học viên đã thanh toán số tiền ${formatCurrency(amount)}?`)) return;
      try {
        await apiPost('/api/finance/payments', {
          invoice_id: id,
          amount: amount,
          payment_method: 'BANK_TRANSFER',
          transaction_ref: 'TRANS_' + Date.now()
        });
        showToast('success', 'Ghi nhận thanh toán thành công!');
        loadInvoices();
      } catch (e) {}
    }

    loadInvoices();
  </script>
</body>
</html>
