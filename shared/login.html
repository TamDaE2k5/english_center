<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Trung tâm Anh ngữ</title>
  <link rel="stylesheet" href="/shared/css/variables.css">
  <link rel="stylesheet" href="/shared/css/base.css">
  <link rel="stylesheet" href="/shared/css/components.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: var(--space-md);
    }
    .login-box {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      box-shadow: var(--shadow-lg);
    }
    .brand-header {
      text-align: center;
      margin-bottom: var(--space-xl);
    }
    .brand-header h1 {
      font-size: 22px;
      color: var(--color-primary);
      margin-top: 8px;
    }
    .demo-accounts {
      margin-top: var(--space-lg);
      padding: var(--space-md);
      background-color: var(--color-bg);
      border-radius: var(--radius-md);
      border: 1px dashed var(--color-border);
    }
    .demo-accounts p {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-secondary);
      margin-bottom: 8px;
    }
    .demo-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="brand-header">
      <div style="font-size: 40px;">🎓</div>
      <h1>Trung Tâm Anh Ngữ</h1>
      <p class="text-secondary text-sm">Cổng quản lý & học tập trực tuyến</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="label" for="email">Email đăng nhập <span class="required">*</span></label>
        <input type="email" id="email" class="form-input" placeholder="admin@english.edu.vn" required>
      </div>

      <div class="form-group">
        <label class="label" for="password">Mật khẩu <span class="required">*</span></label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px;" id="loginBtn">
        Đăng nhập vào hệ thống
      </button>
    </form>

    <div class="demo-accounts">
      <p>💡 Đăng nhập nhanh cho demo (1-Click qua /auth/login):</p>
      <div class="demo-btn-group">
        <button type="button" class="btn btn-secondary btn-sm demo-login-btn" onclick="quickLogin('admin@english.edu.vn', 'admin123')">Admin</button>
        <button type="button" class="btn btn-secondary btn-sm demo-login-btn" onclick="quickLogin('staff@english.edu.vn', 'staff123')">Học vụ</button>
        <button type="button" class="btn btn-secondary btn-sm demo-login-btn" onclick="quickLogin('teacher@english.edu.vn', 'teacher123')">Giáo viên</button>
        <button type="button" class="btn btn-secondary btn-sm demo-login-btn" onclick="quickLogin('student@english.edu.vn', 'student123')">Học viên</button>
      </div>
    </div>

    <div style="margin-top: var(--space-md); text-align: center;">
      <a href="/admission/account.html" class="text-sm">Đăng ký tài khoản / Quên mật khẩu</a>
    </div>
  </div>

  <script src="/shared/js/auth.js"></script>
  <script src="/shared/js/api.js"></script>
  <script>
    /**
     * Thực hiện đăng nhập thật qua Gateway (/auth/login) và lưu JWT access_token + refresh_token.
     * @param {string} email Email tài khoản
     * @param {string} password Mật khẩu tài khoản
     */
    async function performLogin(email, password) {
      const btn = document.getElementById('loginBtn');
      const demoBtns = document.querySelectorAll('.demo-login-btn');
      btn.disabled = true;
      btn.innerText = 'Đang xác thực...';
      demoBtns.forEach(b => { b.disabled = true; });

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const result = await res.json().catch(() => null);

        if (res.ok && result && result.success && result.data) {
          const accessToken = result.data.access_token || result.data.token;
          if (!accessToken) {
            showToast('error', 'Máy chủ không trả về access_token hợp lệ.');
            return;
          }
          setSession(accessToken, result.data.user, result.data.refresh_token);
          const role = result.data.user?.role || '';
          showToast('success', `Đăng nhập thành công (${role})!`);
          setTimeout(() => {
            if (result.data.user?.must_change_password) {
              window.location.href = '/admission/account.html';
              return;
            }
            const redirect = sessionStorage.getItem('redirect_after_login') || '/';
            sessionStorage.removeItem('redirect_after_login');
            window.location.href = redirect;
          }, 500);
        } else {
          const errMsg = (result && result.error && result.error.message)
            || (result && result.message)
            || 'Email hoặc mật khẩu không chính xác.';
          showToast('error', errMsg);
        }
      } catch (err) {
        console.error('Auth login failed:', err);
        showToast('error', 'Không thể kết nối tới máy chủ xác thực (/auth/login).');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Đăng nhập vào hệ thống';
        demoBtns.forEach(b => { b.disabled = false; });
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      await performLogin(email, password);
    });

    /**
     * Điền nhanh thông tin tài khoản demo (khớp scripts/init-db.sql) và đăng nhập thật qua /auth/login.
     * @param {string} email Email demo
     * @param {string} password Mật khẩu demo
     */
    async function quickLogin(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      await performLogin(email, password);
    }
  </script>
</body>
</html>
