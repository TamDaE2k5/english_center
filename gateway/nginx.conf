events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M;

    server {
        listen 8080;
        server_name localhost;

        # Bỏ qua favicon.ico để tránh lỗi 404 trên console trình duyệt
        location = /favicon.ico {
            return 204;
            access_log off;
            log_not_found off;
        }

        # ========================================================
        # 1. Static Web Frontends
        # ========================================================

        # Shared assets (CSS, JS, Common Icons)
        location = /shared {
            return 301 /shared/;
        }
        location /shared/ {
            alias /usr/share/nginx/html/shared/;
            index index.html;
            try_files $uri $uri/ =404;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Root Home Portal
        location = / {
            root /usr/share/nginx/html/shared;
            try_files /index.html =404;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Module 1: Admission Frontend
        location = /admission {
            return 301 /admission/;
        }
        location = /admission/ {
            root /usr/share/nginx/html;
            try_files /admission/courses.html =404;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
        location /admission/ {
            alias /usr/share/nginx/html/admission/;
            try_files $uri =404;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Module 2: Student Frontend
        location = /student {
            return 301 /student/;
        }
        location = /student/ {
            root /usr/share/nginx/html;
            try_files /student/students.html =404;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
        location /student/ {
            alias /usr/share/nginx/html/student/;
            try_files $uri =404;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Module 3: Learning Frontend
        location = /learning {
            return 301 /learning/;
        }
        location = /learning/ {
            root /usr/share/nginx/html;
            try_files /learning/materials.html =404;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
        location /learning/ {
            alias /usr/share/nginx/html/learning/;
            try_files $uri =404;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Module 4: Finance Frontend
        location = /finance {
            return 301 /finance/;
        }
        location = /finance/ {
            root /usr/share/nginx/html;
            try_files /finance/invoices.html =404;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
        location /finance/ {
            alias /usr/share/nginx/html/finance/;
            try_files $uri =404;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # ========================================================
        # 2. Reverse Proxy to Microservice APIs
        # ========================================================

        # Auth Endpoints (handled by Admission service)
        location /auth/ {
            proxy_pass http://admission-service:8081/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admission Service API
        location /api/admission/ {
            proxy_pass http://admission-service:8081/api/admission/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Student Service API (+ alias /api/v1/ theo docs/contract.md)
        location /api/student/ {
            proxy_pass http://student-service:8082/api/student/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/v1/ {
            rewrite ^/api/v1/(.*)$ /api/student/$1 break;
            proxy_pass http://student-service:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Learning Service API
        location /api/learning/ {
            proxy_pass http://learning-service:8083/api/learning/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Finance Service API
        location /api/finance/ {
            proxy_pass http://finance-service:8084/api/finance/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
