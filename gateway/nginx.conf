events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 8080;
        server_name localhost;

        # ========================================================
        # 1. Static Web Frontends
        # ========================================================

        # Shared assets (CSS, JS, Common Icons)
        location /shared/ {
            alias /usr/share/nginx/html/shared/;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Root Home Portal
        location = / {
            root /usr/share/nginx/html/shared;
            try_files /index.html =404;
        }

        # Module 1: Admission Frontend
        location /admission/ {
            alias /usr/share/nginx/html/admission/;
            try_files $uri $uri/ /admission/courses.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Module 2: Student Frontend
        location /student/ {
            alias /usr/share/nginx/html/student/;
            try_files $uri $uri/ /student/students.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Module 3: Learning Frontend
        location /learning/ {
            alias /usr/share/nginx/html/learning/;
            try_files $uri $uri/ /learning/materials.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Module 4: Finance Frontend
        location /finance/ {
            alias /usr/share/nginx/html/finance/;
            try_files $uri $uri/ /finance/invoices.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # ========================================================
        # 2. Reverse Proxy to Microservice APIs
        # ========================================================

        # Auth Endpoints (handled by Admission service)
        location /auth/ {
            proxy_pass http://admission-service:8081/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Admission Service API
        location /api/admission/ {
            proxy_pass http://admission-service:8081/api/admission/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Student Service API
        location /api/student/ {
            proxy_pass http://student-service:8082/api/student/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Learning Service API
        location /api/learning/ {
            proxy_pass http://learning-service:8083/api/learning/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Finance Service API
        location /api/finance/ {
            proxy_pass http://finance-service:8084/api/finance/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
